<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>BioQuiz - Momentanément indisponible</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#F4F2F8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#14122B" media="(prefers-color-scheme: dark)">
    <!-- La page se recharge toute seule toutes les 3 minutes : quand le site rouvre, il réapparaît sans rien faire. -->
    <meta http-equiv="refresh" content="180">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23E7E6F7'/%3E%3Cellipse cx='25' cy='28' rx='13' ry='11' fill='%23FBE6EE' stroke='%23C93A6E' stroke-width='2'/%3E%3Ccircle cx='26' cy='28' r='5' fill='%233F3D9A'/%3E%3Cellipse cx='43' cy='42' rx='11' ry='9' fill='%23FBE6EE' stroke='%23C93A6E' stroke-width='2'/%3E%3Ccircle cx='43' cy='42' r='4' fill='%233F3D9A'/%3E%3C/svg%3E">
    <style>
        :root {
            --paper: #F4F2F8;
            --surface: #FFFFFF;
            --ink: #1D1B3A;
            --muted: #615E7E;
            --line: #DEDAEC;
            --hema: #3F3D9A;
            --hema-ink: #FFFFFF;
            --hema-soft: #E7E6F7;
            --eosin: #C93A6E;
            --eosin-soft: #FBE6EE;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #14122B;
                --surface: #1E1B3C;
                --ink: #EEEDFA;
                --muted: #A9A6C7;
                --line: #35315F;
                --hema: #9795F2;
                --hema-ink: #14122B;
                --hema-soft: #2A2757;
                --eosin: #F07AA3;
                --eosin-soft: #3A2142;
            }
        }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
            background: var(--paper);
            color: var(--ink);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.55;
            text-align: center;
        }
        .card {
            width: 100%;
            max-width: 460px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 36px 26px 30px;
        }
        .logo { width: 96px; height: 96px; display: block; margin: 0 auto 18px; }
        .pill {
            display: inline-block;
            margin: 0 0 14px;
            padding: 5px 12px;
            border-radius: 999px;
            background: var(--eosin-soft);
            color: var(--eosin);
            font-size: .82rem;
            font-weight: 700;
            letter-spacing: .02em;
        }
        h1 { margin: 0 0 10px; font-size: 1.75rem; line-height: 1.2; font-weight: 800; }
        p { margin: 0 0 12px; color: var(--muted); font-size: 1.05rem; }
        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 13px 26px;
            border-radius: 14px;
            background: var(--hema);
            color: var(--hema-ink);
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:focus-visible { outline: 3px solid var(--hema); outline-offset: 3px; }
        .small { margin: 18px 0 0; font-size: .88rem; }
        footer { margin-top: 22px; color: var(--muted); font-size: .88rem; }
    </style>
</head>
<body>
    <main class="card" role="main">
        <svg class="logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
            <circle cx="32" cy="32" r="30" fill="var(--hema-soft)"/>
            <ellipse cx="25" cy="28" rx="13" ry="11" fill="var(--eosin-soft)" stroke="var(--eosin)" stroke-width="2"/>
            <circle cx="26" cy="28" r="5" fill="var(--hema)"/>
            <ellipse cx="43" cy="42" rx="11" ry="9" fill="var(--eosin-soft)" stroke="var(--eosin)" stroke-width="2"/>
            <circle cx="43" cy="42" r="4" fill="var(--hema)"/>
        </svg>
        <p class="pill">BioQuiz</p>
        <h1>Site momentanément indisponible</h1>
        <p>Nous apportons quelques modifications au site. Il sera de nouveau accessible très bientôt.</p>
        <a class="btn" href="./" onclick="location.reload(); return false;">Réessayer</a>
        <p class="small">Cette page se met à jour toute seule : tu peux la laisser ouverte.</p>
    </main>
    <footer>Réalisé par Bleziri</footer>
</body>
</html>
